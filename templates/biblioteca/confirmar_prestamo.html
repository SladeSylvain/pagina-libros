{% extends 'base.html' %}
{% block title %}Confirmar Préstamo{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4 text-center">
                <h2 class="fw-bold mb-3">Confirmar Préstamo</h2>
                <p class="fs-5">¿Deseas solicitar el préstamo de:</p>
                <h4 class="text-dark fw-bold">{{ libro.titulo }}</h4>
                <p class="text-muted">{{ libro.autor }}</p>
                <hr>
                <form method="post" class="d-flex gap-3 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-dark px-4">Confirmar</button>
                    <a href="{% url 'detalle_libro' libro.pk %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
